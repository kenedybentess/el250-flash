<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Leitores PRO</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Tahoma,sans-serif}
body{background:#f4f6f9}
.sidebar{width:250px;background:#212529;color:white;height:100vh;position:fixed;left:0;top:0;overflow-y:auto}
.sidebar h3{padding:20px;text-align:center;background:#0d6efd;position:sticky;top:0}
.sidebar ul{list-style:none;padding:0;margin:0}
.sidebar a{color:white;text-decoration:none;display:block;padding:15px 20px;transition:.3s}
.sidebar a:hover{background:#0d6efd}
.sidebar a.active{background:#0d6efd}
.sidebar li.logout{padding:15px 20px;cursor:pointer;transition:.3s}
.sidebar li.logout:hover{background:#dc3545}
.topbar{margin-left:250px;height:60px;background:white;display:flex;justify-content:space-between;align-items:center;padding:0 25px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.content{margin-left:250px;padding:25px;height:calc(100vh - 60px);overflow:auto}
.card-dashboard{border:none;border-radius:15px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,.08);transition:.3s;height:100%}
.card-dashboard:hover{transform:translateY(-5px)}
.big-number{font-size:35px;font-weight:bold}
@media (max-width: 768px){.sidebar{width:100%;height:auto;position:relative}.topbar,.content{margin-left:0}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
</head>
<body>
<script src="auth.js"></script>
<div id="app">
    <div class="sidebar">
        <h3><i class="bi bi-upc-scan"></i> Leitores PRO</h3>
        <ul>
            <li><a href="index.html" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="produtos.html"><i class="bi bi-box-seam"></i> Produtos</a></li>
            <li><a href="operadores.html"><i class="bi bi-people"></i> Operadores</a></li>
            <li><a href="testes.html"><i class="bi bi-clipboard-check"></i> Testes</a></li>
            <li><a href="logs.html"><i class="bi bi-clock-history"></i> Histórico / Logs</a></li>
            <li><a href="etiquetas.html"><i class="bi bi-printer"></i> Etiquetas</a></li>
            <li class="logout" onclick="AuthSystem.logout()"><i class="bi bi-box-arrow-left"></i> Sair (<span id="nomeUsuario">...</span>)</li>
        </ul>
    </div>
    <div class="topbar">
        <h4>Dashboard <span class="badge bg-danger ms-2">ADMIN</span></h4>
        <div id="userName">Administrador</div>
    </div>
    <div class="content">
        <div class="row g-3 mb-4">
            <div class="col-md-3"><div class="card-dashboard"><h6 class="text-muted">Total Testes</h6><div class="big-number" id="totalTestes">0</div></div></div>
            <div class="col-md-3"><div class="card-dashboard"><h6 class="text-muted">Aprovados</h6><div class="big-number text-success" id="totalAprovados">0</div></div></div>
            <div class="col-md-3"><div class="card-dashboard"><h6 class="text-muted">Reprovados</h6><div class="big-number text-danger" id="totalReprovados">0</div></div></div>
            <div class="col-md-3"><div class="card-dashboard"><h6 class="text-muted">Produtos</h6><div class="big-number" id="totalProdutos">0</div></div></div>
        </div>
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-clock-history"></i> Últimos Testes</h5></div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover"><thead><tr><th>Série</th><th>Produto</th><th>Modelo</th><th>Operador</th><th>Resultado</th></tr></thead><tbody id="ultimosTestes"></tbody></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
if(!localStorage.getItem('produtos')) localStorage.setItem('produtos',JSON.stringify([]));
if(!localStorage.getItem('operadores')) localStorage.setItem('operadores',JSON.stringify([{id:'1',matricula:'ADMIN',nome:'Administrador',setor:'Administrativo',turno:'Administrativo',status:'Ativo',perfil:'admin',senha:'123',usuario:'admin'}]));
if(!localStorage.getItem('testes')) localStorage.setItem('testes',JSON.stringify([]));

function atualizarDashboard(){
    const testes=JSON.parse(localStorage.getItem('testes') || '[]');
    const produtos=JSON.parse(localStorage.getItem('produtos') || '[]');
    document.getElementById('totalTestes').innerText=testes.length;
    document.getElementById('totalAprovados').innerText=testes.filter(t=>t.resultado==='APROVADO').length;
    document.getElementById('totalReprovados').innerText=testes.filter(t=>t.resultado==='REPROVADO').length;
    document.getElementById('totalProdutos').innerText=produtos.length;
    const tbody=document.getElementById('ultimosTestes');
    const ultimos=testes.slice(0,5);
    tbody.innerHTML=ultimos.length===0?'<tr><td colspan="5" class="text-center text-muted py-4">Nenhum teste realizado ainda</td></tr>':
    ultimos.map(t=>`<tr><td><strong>${t.serie}</strong></td><td>${t.produtoCodigo}</td><td>${t.modelo || '-'}</td><td>${t.operador}</td><td><span class="badge ${t.resultado==='APROVADO'?'bg-success':'bg-danger'}">${t.resultado}</span></td></tr>`).join('');
}
document.addEventListener('DOMContentLoaded', atualizarDashboard);
</script>
</body>
</html>
